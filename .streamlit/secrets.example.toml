# Copy to secrets.toml locally or paste in Streamlit Cloud Secrets.
# Use credentials supplied by your TURN provider; never commit secrets.toml.
[webrtc]
ice_servers = [
  { urls = ["stun:stun.l.google.com:19302"] },
  { urls = ["turn:YOUR_TURN_HOST:3478"], username = "YOUR_USERNAME", credential = "YOUR_CREDENTIAL" }
]
